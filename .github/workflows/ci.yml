name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted commit without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan for known malware indicators
        run: node scripts/security/scan-malware.mjs

  checks:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run checks
        run: pnpm check

      - name: Check OpenAPI breaking changes
        run: pnpm openapi:check
        continue-on-error: false

      - name: Upload OpenAPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-breaking-changes-report
          path: docs/api/breaking-changes-report.json

      - name: Check configuration reference is in sync
        run: pnpm config:reference:check

      - name: Verify release artifact checksums
        run: |
          cd docs/api
          sha256sum -c checksums.sha256
          cd ../..

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate testnet release configuration
        run: pnpm deploy:testnet:check

  database-migrations:
    needs: malware-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify migrations from empty database
        run: pnpm prisma:migrations:verify
        env:
          MAINTENANCE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Run migration integration tests
        run: pnpm prisma:migrations:test
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumenbazaar_migration_test

      - name: Clean up test databases
        if: always()
        run: pnpm prisma:migrations:cleanup
        env:
          MAINTENANCE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
