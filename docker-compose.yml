services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumenbazaar
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumenbazaar"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev:api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lumenbazaar
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app

  worker:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev:worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lumenbazaar
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app

  mcp-server:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm start:mcp:http"
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env.example
    environment:
      API_BASE_URL: http://api:3000
      MCP_HOST: 0.0.0.0
      MCP_PATH: /mcp
      MCP_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/app

volumes:
  postgres-data:
  redis-data:
